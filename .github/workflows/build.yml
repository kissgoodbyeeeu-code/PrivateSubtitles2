name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      # 先做无签名编译：验证代码能编译，并产出未签名 IPA（可用 SideStore/AltStore 自签安装）
      - name: Build (unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project PrivateSubtitles.xcodeproj \
            -scheme PrivateSubtitles \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build | tee xcodebuild.log | grep -E "error:|warning: .*deprecated|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" xcodebuild.log

      - name: Package unsigned IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/PrivateSubtitles.app Payload/
          zip -qry PrivateSubtitles-unsigned.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: PrivateSubtitles-unsigned-ipa
          path: PrivateSubtitles-unsigned.ipa
          retention-days: 14

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: xcodebuild.log
          retention-days: 7

  # TODO(有开发者账号后)：签名 + 上传 TestFlight
  # 需要的 GitHub Secrets：
  #   APPLE_TEAM_ID, ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8 (App Store Connect API Key)
  # 用 xcodebuild archive -allowProvisioningUpdates + App Store Connect API Key 自动签名，
  # 再 xcrun altool / notarytool 上传。
