name: PrivateSubtitles

options:
  bundleIdPrefix: com.kissgoodbye
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    # 有开发者账号后，把 Team ID 填到这里（或在 CI 里通过环境变量覆盖）
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic

targets:
  PrivateSubtitles:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Shared
    dependencies:
      - target: BroadcastExtension
      - target: SafariExtension
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: 双语字幕
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSMicrophoneUsageDescription: 用麦克风收听视频里的英文语音并实时翻译。
        NSSpeechRecognitionUsageDescription: 在本机把英文语音转成文字，用来生成字幕。
        # P2 的画中画悬浮字幕需要后台音频 / PiP 能力
        UIBackgroundModes:
          - audio
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kissgoodbye.privatesubtitles
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    scheme: {}

  # 广播上传扩展：抓 Safari 等其他 App 正在播放的声音
  BroadcastExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: Broadcast
      - path: Shared
    info:
      path: Broadcast/Info.plist
      properties:
        CFBundleDisplayName: 双语字幕
        NSExtension:
          NSExtensionPointIdentifier: com.apple.broadcast-services-upload
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).SampleHandler
          RPBroadcastProcessMode: RPBroadcastProcessModeSampleBuffer
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kissgoodbye.privatesubtitles.broadcast
        TARGETED_DEVICE_FAMILY: "1"

  # Safari 网页扩展：在网页视频上抓声音、显示字幕（不需要开直播）
  SafariExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: SafariExtension/SafariWebExtensionHandler.swift
      - path: SafariExtension/SafariBridge.swift
      - path: Shared
      - path: SafariExtension/Resources/manifest.json
        buildPhase: resources
      - path: SafariExtension/Resources/background.js
        buildPhase: resources
      - path: SafariExtension/Resources/content.js
        buildPhase: resources
      - path: SafariExtension/Resources/content.css
        buildPhase: resources
      - path: SafariExtension/Resources/_locales
        type: folder
        buildPhase: resources
      - path: SafariExtension/Resources/images
        type: folder
        buildPhase: resources
    info:
      path: SafariExtension/Info.plist
      properties:
        CFBundleDisplayName: 双语字幕
        NSExtension:
          NSExtensionPointIdentifier: com.apple.Safari.web-extension
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).SafariWebExtensionHandler
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kissgoodbye.privatesubtitles.safari
        TARGETED_DEVICE_FAMILY: "1"
